name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Some OCR tests need a Windows OCR engine (en-US). Nobody has checked
      # yet that the GitHub runner image has one. If a test fails here but
      # passes on your PC, mark it with #[ignore] and say why.
      - name: Run tests
        run: cargo test --locked
